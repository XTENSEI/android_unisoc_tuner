name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the notes walk the tag range, so the tags have to be fetched
          fetch-depth: 0

      - name: Build module zip
        run: sh build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unisoc-tuner
          path: out/*.zip
          if-no-files-found: error

      - name: Release notes from the commit log
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sh tools/notes.sh "$GITHUB_REF_NAME" | tee notes.md

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Unisoc Tuner $GITHUB_REF_NAME" \
            --notes-file notes.md \
            out/*.zip
